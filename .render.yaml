services:
  - type: web
    name: schoolmanager
    env: docker
    region: oregon
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_HOST
        fromDatabase:
          name: schoolmanager-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: schoolmanager-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: schoolmanager-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: schoolmanager-db
          property: password
    healthCheckPath: /health.php
    autoDeploy: true

  - type: mysql
    name: schoolmanager-db
    plan: starter
    region: oregon
    ipAllowList: []
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: schoolmanager
      - key: MYSQL_USER
        generateValue: true
      - key: MYSQL_PASSWORD
        generateValue: true
